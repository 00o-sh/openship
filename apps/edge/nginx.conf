# Openship edge — baked, complete config for the CONTAINERIZED edge.
#
# GENERATED FILE — DO NOT EDIT. Source: packages/adapters/src/infra/edge-baked-conf.ts
# Regenerate with `bun run edge:conf` in packages/adapters. A test asserts this
# file matches its generator, so a hand edit here fails CI.
#
# It is generated because the directives below are shared with the bare/remote
# edge, which gets them patched in from TypeScript constants. This file cannot read
# those constants (it is COPYed into the image), and a hand-kept copy diverges on
# values — a dict size, a loopback port, a docroot — in ways that only break one
# install path, quietly.
#
# Nothing here is edited at runtime: the api writes managed vhosts into
# sites-enabled/*.conf (a host bind mount) and reloads via `docker exec`.
worker_processes auto;
error_log /usr/local/openresty/nginx/logs/error.log warn;
pid /usr/local/openresty/nginx/logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # nginx sizes the server_name hash to the LONGEST server_name it loads, and
    # the 64-byte default rejects the whole config — `could not build
    # server_names_hash` fails `nginx -t`, so the reload is refused and NO route
    # change lands until the offending vhost is removed. A single long hostname
    # (a generated `<project>-<service>.opsh.io`, or any custom domain past ~63
    # chars) would otherwise wedge routing for every site on the box.
    server_names_hash_bucket_size 128;

    # Shared-memory zones the openship Lua depends on (analytics counters, raw-log
    # ring buffers + live-log pipe, per-route rules cache, rate-limit counters).
    # Sizes come from EDGE_SHARED_DICTS — the same list the bare edge is patched
    # with, because a zone that is 256m on one edge and 16m on the other evicts
    # under load on exactly one of them.
    lua_shared_dict analytics 256m;
    lua_shared_dict request_data 128m;
    lua_shared_dict rules 32m;
    lua_shared_dict rl_counters 32m;
    lua_shared_dict visitors 64m;
    # OpenResty default lualib + the baked openship modules.
    lua_package_path "/usr/local/openresty/site/lualib/?.lua;;";

    # Openship — recover the real client address from a trusted front proxy.
    #
    # GENERATED. Source: packages/adapters/src/infra/edge-real-ip.ts
    #
    # Without this, remote_addr is the PROXY on any box behind Cloudflare or a load
    # balancer, which silently breaks four things at once: visitor country resolves to
    # the PoP, distinct-visitor counts collapse toward the number of PoPs, per-IP rate
    # limits put the whole planet behind one PoP in a single bucket, and IP bans ban a
    # PoP instead of a visitor.
    #
    # set_real_ip_from does NOT mean 'trust this header'. It means 'trust this header
    # only when the TCP peer is one of these addresses'. Someone hitting the origin
    # directly with a forged header is not connecting FROM Cloudflare, so the header is
    # ignored and their real address stands. The trust is anchored to who opened the
    # socket, which a client cannot forge.
    #
    # The header is CF-Connecting-IP.
    # Cloudflare OVERWRITES CF-Connecting-IP, so its value holds nothing the client
    # supplied. It deliberately is NOT X-Forwarded-For: Cloudflare APPENDS to that
    # one, so XFF arrives as '<client-controlled>, <real client>' and reading it
    # left-to-right would let a visitor choose their own apparent address — and
    # with it their rate-limit bucket and which ban rules miss them.

    real_ip_header CF-Connecting-IP;

    # Walk a multi-hop header from the RIGHT, skipping trusted addresses. Inert for a
    # single-value header like CF-Connecting-IP; load-bearing for X-Forwarded-For, where
    # the left-hand entries are whatever the client sent.
    real_ip_recursive on;

    # Cloudflare's published edge ranges (15 v4 + 7 v6).
    # Trusted unconditionally, which is safe by construction: on a box that is not behind
    # Cloudflare no peer ever matches, so every line here is inert. Refresh with
    # `bun run update:cloudflare-ips`.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # Managed vhosts — the api drops <slug>.conf here (host bind mount). An empty
    # glob is not an error, so a fresh edge boots fine.
    include /usr/local/openresty/nginx/conf/sites-enabled/*.conf;

    # Default catch-all. Answers the two probes that arrive addressed to a bare IP
    # (so `Host:` matches no server_name and only `_` is left), 404s every other
    # unrouted host, and keeps the stock OpenResty welcome page away.
    server {
        listen 80 default_server;
        server_name _;

        # ACME http-01 → certbot's transient standalone server on the loopback
        # alt-port. Zero-downtime issuance: certbot binds the port only while
        # issuing, LE hits :80 → here → certbot. No port-80 fight, no webroot.
        location /.well-known/acme-challenge/ {
            proxy_pass http://127.0.0.1:49180;
            proxy_set_header Host $host;
        }

        # Openship Cloud's shared edge proves this box controls a routing target by
        # fetching a token from here. Serves FILES — only tokens we were actually
        # issued. An echo handler would let a third party register THIS box as
        # THEIR target and prove control with our own reply.
        location /.well-known/oblien-proxy-challenge/ {
            root /var/www/acme/oblien;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 404;
        }
    }

    # HTTPS catch-all. WITHOUT a 443 default_server, nginx serves the first-loaded
    # 443 vhost to any request whose SNI matches no server_name - so a domain we do
    # NOT route (removed / never-added / just pointed at this IP) silently gets some
    # other app's cert + backend. That is cross-serving, a security hole. Owning the
    # 443 default and rejecting unknown SNI closes it: an unrouted host gets a TLS
    # handshake failure, never a fallthrough. ssl_reject_handshake (OpenResty/nginx
    # >= 1.19.4; our installer pulls the newest LTS) needs no certificate.
    server {
        listen 443 ssl default_server;
        ssl_reject_handshake on;
    }

    # Internal analytics + live-log streaming API (loopback only). Queried by the
    # api over the Docker network / exec; never publicly exposed.
    server {
        listen 127.0.0.1:9145;

        # Long-running Lua content handlers need generous timeouts
        send_timeout          3600s;
        keepalive_timeout     3600s;
        lua_check_client_abort on;

        # SSE live-log stream (long-lived connection)
        location = /logs/stream {
            content_by_lua_file /usr/local/openresty/site/lualib/openship/pipe_stream.lua;
        }

        # REST analytics + health (short-lived)
        location / {
            content_by_lua_file /usr/local/openresty/site/lualib/openship/mgmt_api.lua;
        }
    }
}
